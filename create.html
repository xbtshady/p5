<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 2.0 PWA：装到桌面后自带颜色。色值 = style.css 里的 --bg；
       meta 标签吃不了 CSS 变量，所以换主题时这里要手动跟着改一次 -->
  <meta name="theme-color" content="#d7dbe2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>添加 · P5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://static.cloudbase.net" />
  <!-- Vant 的样式必须排在 css/style.css 之前：style.css 里有一层 --van-* 覆盖要压在它上面 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-list">
  <!-- Vue 挂载前的启动占位层，挂载完成后由 js/create.js 移除 -->
  <div id="boot" class="boot">载入中…</div>

  <div id="app" v-cloak>
    <header class="topbar">
      <a class="text-btn" href="index.html">返回</a>
      <h1 class="topbar-brand">P5</h1>
      <span class="topbar-actions"></span>
    </header>

    <main class="feed-wrap">
      <form class="form" @submit.prevent="submit">
        <div class="field">
          <span class="label">照片</span>
          <van-uploader
            v-model="files"
            :max-count="1"
            :after-read="onRead"
            :after-delete="onDelete"
            :disabled="busy"
          ></van-uploader>
          <p class="size-hint" v-if="sizeText">{{ sizeText }}</p>
        </div>

        <div class="vant-block">
          <van-cell-group inset>
            <van-field
              v-model="title"
              label="标题"
              placeholder="一句话给它起个名"
              :disabled="busy"
            ></van-field>
            <van-field
              v-model="note"
              label="描述"
              type="textarea"
              autosize
              :disabled="busy"
            ></van-field>
          </van-cell-group>
        </div>

        <div class="field">
          <span class="label">标签</span>

          <div class="tag-picker">
            <div class="tag-group" v-for="g in presetGroups" :key="g.name">
              <span class="tag-group-name">{{ g.name }}</span>
              <div class="tag-row">
                <!-- 预置标签原地开关：选中的就在这儿高亮，不再往下面重复列一份 -->
                <button
                  v-for="t in g.tags"
                  :key="t"
                  type="button"
                  class="tag-chip"
                  :class="{ 'is-on': isSelected(t) }"
                  :disabled="busy"
                  :aria-pressed="isSelected(t) ? 'true' : 'false'"
                  @click="toggle(t)"
                >{{ t }}</button>
              </div>
            </div>

            <div class="tag-group" v-if="customTags.length">
              <span class="tag-group-name">自定义</span>
              <div class="tag-row">
                <!-- 点一下就是取消选择。× 用 span 不用 button ——
                     按钮套按钮是非法 HTML，浏览器会把内层拆出来 -->
                <button
                  v-for="t in customTags"
                  :key="t"
                  type="button"
                  class="tag-chip is-on"
                  :disabled="busy"
                  :aria-label="'取消标签 ' + t"
                  @click="toggle(t)"
                ><span>{{ t }}</span><span class="tag-x">×</span></button>
              </div>
            </div>

            <div class="tag-add">
              <input
                v-model="draft"
                type="text"
                :placeholder="tagPlaceholder"
                :disabled="busy || full"
                @keydown.enter.prevent="addCustom"
              />
              <button
                class="text-btn"
                type="button"
                :disabled="busy || full || !draft.trim()"
                @click="addCustom"
              >添加</button>
            </div>

            <p class="tag-hint">{{ tagHint }}</p>
          </div>
        </div>

        <p v-if="error" class="error">{{ error }}</p>

        <van-button
          type="primary"
          block
          round
          native-type="submit"
          :disabled="busy || !file"
        >{{ busy ? statusText : '保存' }}</van-button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2/dist/browser-image-compression.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
