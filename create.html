<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 2.0 PWA：装到桌面后自带颜色。色值 = style.css 里的 --bg；
       meta 标签吃不了 CSS 变量，所以换主题时这里要手动跟着改一次 -->
  <meta name="theme-color" content="#fbfaf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>添加 · P5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://static.cloudbase.net" />
  <!-- Vant 的样式必须排在 css/style.css 之前：style.css 里有一层 --van-* 覆盖要压在它上面 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-list">
  <!-- Vue 挂载前的启动占位层，挂载完成后由 js/create.js 移除 -->
  <div id="boot" class="boot">载入中…</div>

  <div id="app" v-cloak>
    <header class="topbar">
      <a class="text-btn" href="index.html">返回</a>
      <h1 class="topbar-brand">P5</h1>
      <span class="topbar-actions"></span>
    </header>

    <main class="form-wrap">
      <form class="form" @submit.prevent="submit">
        <div class="field">
          <span class="label">照片</span>
          <van-uploader
            v-model="files"
            :max-count="1"
            :after-read="onRead"
            :after-delete="onDelete"
            :disabled="busy"
          ></van-uploader>
          <p class="size-hint" v-if="sizeText">{{ sizeText }}</p>
        </div>

        <div class="vant-block">
          <van-cell-group inset>
            <van-field
              v-model="title"
              label="标题"
              placeholder="请输入标题"
              :disabled="busy"
            ></van-field>
            <van-field
              v-model="note"
              label="描述"
              type="textarea"
              autosize
              placeholder="请输入描述"
              :disabled="busy"
            ></van-field>
          </van-cell-group>
        </div>

        <div class="field">
          <span class="label">档位</span>

          <!-- 站里不接 AI 的剪贴板闭环：复制提示词 → 连照片发给外部 AI → JSON 粘回来。
               提示词正文见 docs/PROMPT.md -->
          <div class="ai-bar">
            <button type="button" class="btn ghost" :disabled="busy" @click="genPrompt">生成提示词</button>
            <button type="button" class="btn ghost" :disabled="busy" @click="toggleReply">粘贴回填</button>
          </div>

          <!-- 只读框：自动复制成功时它是「抄得到」的备份，
               复制失败（非 https / 权限被拒）时它就是唯一的出路 -->
          <textarea
            v-if="promptOpen"
            class="ai-box"
            rows="6"
            readonly
            :value="promptText"
          ></textarea>

          <div v-if="replyOpen" class="reply-wrap">
            <textarea
              ref="replyBox"
              v-model="replyText"
              class="ai-box"
              rows="5"
              placeholder="把 AI 回的 JSON 整段粘在这里"
            ></textarea>
            <button type="button" class="btn" :disabled="busy" @click="applyReply">解析并填入</button>
          </div>

          <p v-if="feedback" class="ai-note">{{ feedback }}</p>
          <p v-if="whyText" class="ai-note">AI 的依据：{{ whyText }}</p>

          <div class="tag-picker">
            <div class="tag-group" v-for="g in facetGroups" :key="g.name">
              <span class="tag-group-name">{{ g.label }}</span>
              <div class="tag-row">
                <!-- 值只能从候选里点选，没有自由输入的框 —— 一旦自由发散，
                     「中长焦」「长焦感」「长焦压缩」会同时存在，按值筛选就废了。
                     单选维度点新值会自动顶掉旧值（只有姿势能多选）。
                     带圆点的是 AI 自己定的值（不在候选里），点一下就没了。 -->
                <button
                  v-for="val in chipValues(g)"
                  :key="val"
                  type="button"
                  class="tag-chip"
                  :class="{ 'is-on': isOn(g.name, val), 'is-loose': isLoose(g, val) }"
                  :disabled="busy"
                  :aria-pressed="isOn(g.name, val) ? 'true' : 'false'"
                  @click="toggle(g.name, val)"
                >{{ val }}</button>
              </div>
            </div>

            <p class="tag-hint">{{ facetHint }}</p>
          </div>
        </div>

        <div class="field" v-if="tips.length">
          <span class="label">下次这样拍（AI 给的，不对就删掉）</span>
          <ul class="tip-list">
            <li v-for="(t, i) in tips" :key="i">
              <span class="tip-text">{{ t }}</span>
              <button
                type="button"
                class="tip-x"
                :disabled="busy"
                aria-label="删掉这条技巧"
                @click="removeTip(i)"
              >×</button>
            </li>
          </ul>
        </div>

        <p v-if="error" class="error">{{ error }}</p>

        <van-button
          type="primary"
          block
          native-type="submit"
          :disabled="busy || !file"
        >{{ busy ? statusText : '保存' }}</van-button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2/dist/browser-image-compression.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/facets.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
