<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 2.0 PWA：装到桌面后自带颜色。色值 = style.css 里的 --bg；
       meta 标签吃不了 CSS 变量，所以换主题时这里要手动跟着改一次 -->
  <meta name="theme-color" content="#d7dbe2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>登录 · P5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://static.cloudbase.net" />
  <!-- Vant 的样式必须排在 css/style.css 之前：style.css 里有一层 --van-* 覆盖要压在它上面 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Vue 挂载前的启动占位层，挂载完成后由 js/login.js 移除 -->
  <div id="boot" class="boot">载入中…</div>

  <div id="app" v-cloak>
    <main class="card">
      <h1 class="brand">P5</h1>

      <form class="form" @submit.prevent="submit">
        <!-- 标签并进占位提示（现代登录表单通行做法），标签本身视觉隐藏、
             留在无障碍树里给读屏用。用原生 input 而不是 van-field：
             Vant 的 aria-* 只会落到外层 div 上、内部 input 拿不到，
             label 渲染的也是 <div>，做不了 label→input 的关联 -->
        <div class="login-fields">
          <label class="sr-only" for="login-username">用户名</label>
          <input
            id="login-username"
            v-model.trim="username"
            placeholder="请输入用户名"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            :disabled="busy"
          />

          <label class="sr-only" for="login-password">密码</label>
          <input
            id="login-password"
            v-model="password"
            type="password"
            placeholder="请输入密码"
            autocomplete="current-password"
            :disabled="busy"
          />
        </div>

        <p v-if="error" class="error">{{ error }}</p>

        <van-button
          type="primary"
          block
          round
          native-type="submit"
          :disabled="busy || !username || !password"
        >{{ busy ? '登录中…' : '登录' }}</van-button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
