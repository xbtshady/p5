<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>P5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://static.cloudbase.net" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Vue 挂载前的启动占位层，挂载完成后由 js/app.js 移除 -->
  <div id="boot" class="boot">载入中…</div>

  <div id="app" v-cloak>
    <main class="card profile">
      <div class="avatar">{{ profile.initial }}</div>

      <h1 class="nickname">{{ profile.name }}</h1>
      <p class="username" v-if="profile.username">@{{ profile.username }}</p>

      <dl class="meta">
        <div class="meta-row">
          <dt>用户 ID</dt>
          <dd class="mono">{{ profile.uid }}</dd>
        </div>
        <div class="meta-row">
          <dt>注册时间</dt>
          <dd>{{ profile.created }}</dd>
        </div>
        <div class="meta-row">
          <dt>登录方式</dt>
          <dd>{{ profile.provider }}</dd>
        </div>
      </dl>

      <p v-if="error" class="error">{{ error }}</p>

      <button class="btn ghost" :disabled="busy" @click="logout">
        {{ busy ? '退出中…' : '退出登录' }}
      </button>

      <p class="hint">退出后可用其它账号登录</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
