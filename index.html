<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 2.0 PWA：装到桌面后自带颜色。色值 = style.css 里的 --bg；
       meta 标签吃不了 CSS 变量，所以换主题时这里要手动跟着改一次 -->
  <meta name="theme-color" content="#d7dbe2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>P5</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://static.cloudbase.net" />
  <!-- Vant 的样式必须排在 css/style.css 之前：style.css 里有一层 --van-* 覆盖要压在它上面 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-list">
  <!-- Vue 挂载前的启动占位层，挂载完成后由 js/app.js 移除 -->
  <div id="boot" class="boot">载入中…</div>

  <div id="app" v-cloak>
    <header class="topbar" :class="{ 'is-scrolled': scrolled }">
      <h1 class="topbar-brand">P5</h1>
      <nav class="topbar-actions">
        <a class="add-btn" href="create.html" aria-label="添加照片">＋</a>
        <button class="text-btn" type="button" :disabled="busy" @click="logout">
          {{ busy ? '退出中…' : '退出' }}
        </button>
      </nav>
    </header>

    <main class="feed-wrap">
      <p v-if="error" class="error">{{ error }}</p>

      <!-- 探索：按维度分组的分面筛选（0.15）。
           这是「以后拍照前查参考」的主要入口 —— 想练中长焦就点「中长焦」，
           再叠一个「逆光」就是中长焦的逆光案例，比按时间往下翻有效得多。
           维度内单选（点同维度的新值是替换，再点一次是取消），跨维度叠加。 -->
      <section class="explore" v-if="facetGroups.length || activeTags.length">
        <h2 class="explore-title">探索</h2>

        <!-- 一组一个维度。组名 / 胶囊复用新增页的 .tag-group-name / .tag-row / .tag-chip：
             同一套视觉语言，两页看起来是一个系统 -->
        <div class="explore-group" v-for="g in facetGroups" :key="g.name">
          <span class="tag-group-name">{{ g.name }}</span>
          <div class="tag-row">
            <button
              v-for="v in g.values"
              :key="v.tag"
              type="button"
              class="tag-chip"
              :class="{ 'is-on': isActive(v.tag) }"
              :disabled="busy"
              :aria-pressed="isActive(v.tag) ? 'true' : 'false'"
              @click="filterBy(v.tag)"
            >{{ v.value }}<span class="tag-count">{{ v.count }}</span></button>
          </div>
        </div>

        <!-- 筛选态要能一眼看出来「现在不是全部」，否则会以为照片丢了。
             单项取消 = 再点那个已高亮的胶囊；这行只负责一眼可见 + 全部清除 -->
        <p class="explore-active" v-if="activeTags.length">
          <span>只看 {{ activeText }}</span>
          <button class="text-btn" type="button" :disabled="busy" @click="clearFilter">
            清除
          </button>
        </p>
      </section>

      <p v-if="!error && !photos.length" class="empty">
        {{ activeTags.length ? '这个筛选下还没有照片。' : '还没有照片。点右上角 ＋ 记下第一张。' }}
      </p>

      <ul class="feed" v-if="photos.length">
        <!-- --i 给 CSS 算错峰入场延时。⚠️ 值必须是数字而不是字符串：
             Vue 会把字符串原样写成 style="--i: 6"，而 calc('6' * 50ms) 是非法表达式，
             整个 animation 简写随之失效 —— 表现为**卡片全透明**（动画停在 from 帧），
             控制台却一声不吭。封顶 6 是为了第 20 张不用等 1 秒才出现 -->
        <li
          class="shot"
          v-for="(p, i) in photos"
          :key="p.id"
          :style="{ '--i': Math.min(i, 6) }"
        >
          <!-- 删除按钮常驻在卡片右上角，压在照片上。
               它是 <img> 的兄弟节点而不是子节点，所以点它不会连带触发全屏看图 -->
          <button
            class="shot-del"
            type="button"
            :disabled="busy"
            :aria-label="'删除 ' + (p.title || '这张照片')"
            @click="remove(p)"
          >×</button>

          <!-- 点图全屏看：走 Vant 的 showImagePreview，自带双指缩放和左右切换 -->
          <img
            v-if="p.url"
            :src="p.url"
            :alt="p.title || '照片'"
            loading="lazy"
            :class="{ 'is-loaded': p.loaded }"
            @load="p.loaded = true"
            @click="preview(i)"
          />
          <div v-else class="shot-fallback">图片暂时取不到</div>

          <div class="shot-body">
            <p class="shot-title" v-if="p.title">{{ p.title }}</p>

            <!-- 0.14 档位一行：只显示值（「镜头:中长焦」只显「中长焦」），
                 一行塞不下 6 个「维度:值」；维度名在筛选区出现（0.15）。
                 超长单行省略，全部档位在展开区里折行看 -->
            <p class="shot-facets" v-if="p.facetValues.length">
              {{ p.facetValues.join(' · ') }}
            </p>

            <!-- 日期 + 技巧条数。点这一行原地展开描述 / 全部档位 / 技巧，
                 不跳详情页（PRODUCT §3.3）。没东西可展开时只有日期，不渲染按钮 -->
            <div class="shot-meta">
              <p class="shot-date">{{ p.date }}</p>
              <button
                v-if="p.expandable"
                type="button"
                class="shot-toggle"
                :aria-expanded="p.open ? 'true' : 'false'"
                @click="toggle(p)"
              >{{ p.tips.length ? p.tips.length + ' 条技巧' : (p.open ? '收起' : '展开') }}<span
                  class="shot-caret"
                  :class="{ 'is-open': p.open }"
                >▾</span></button>
            </div>

            <!-- 展开区：描述 + 全部档位（折行）+ 技巧。顺序照 PRODUCT §3.1 -->
            <div class="shot-more" v-if="p.open">
              <p class="shot-note" v-if="p.note">{{ p.note }}</p>
              <p class="shot-facets is-full" v-if="p.facetValues.length">
                {{ p.facetValues.join(' · ') }}
              </p>
              <ul class="tip-list" v-if="p.tips.length">
                <li v-for="(t, ti) in p.tips" :key="ti"><span class="tip-text">{{ t }}</span></li>
              </ul>
            </div>
          </div>
        </li>
      </ul>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/facets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
